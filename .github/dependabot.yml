version: 2
# Grouped so a week's updates arrive as a few pull requests, not dozens.
# Security fixes come as their own grouped pull request as soon as they're out.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint (via eslint-config-next) does not support TS 7 yet,
      # so a TS 7 bump breaks lint. Drop this once it does.
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  # The Node.js base image in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on the Node.js LTS line the app is tested with; move up on purpose.
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: monthly
    groups:
      docs:
        patterns: ["*"]
