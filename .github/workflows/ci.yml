name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge commit and its parent (the base), for the screenshot check.
          fetch-depth: 2
      # docs/screenshots/ is regenerated on main by the Screenshots workflow. Feature
      # branches that re-render it all clash on the same binary files, so a PR may add
      # new shots but not change existing ones (the bot's own branch is exempt).
      - name: Existing screenshots unchanged
        if: github.event_name == 'pull_request' && github.head_ref != 'bot/screenshots'
        run: |
          changed=$(git diff --name-only --diff-filter=M HEAD^1 HEAD -- docs/screenshots)
          if [ -n "$changed" ]; then
            echo "::error::This PR changes generated screenshots. Drop those changes (git checkout origin/main -- docs/screenshots), the Screenshots workflow updates them after the merge:"
            echo "$changed"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      # Catches two branches whose migrations point at the same parent (npm run db:rebase fixes it).
      - name: Migrations consistent
        run: npx drizzle-kit check
      - name: Untranslated text
        run: npm run check:i18n
      - name: Mail goes through templates
        run: npm run check:mail
      - name: Changelog entries
        run: npm run check:changelog
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          DATABASE_PATH: ${{ runner.temp }}/build.db
      # The screenshot run doubles as a smoke test: it starts the production
      # build on demo data and fails if any page errors or redirects to login.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke test (render every page)
        run: npm run screenshots
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: docs/screenshots/*.png
          retention-days: 14
