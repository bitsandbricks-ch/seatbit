name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          DATABASE_PATH: ${{ runner.temp }}/build.db
      # The screenshot run doubles as a smoke test: it starts the production
      # build on demo data and fails if any page errors or redirects to login.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke test (render every page)
        run: npm run screenshots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: docs/screenshots/*.png
          retention-days: 14
