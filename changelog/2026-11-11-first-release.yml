date: 2026-11-11
type: new
pr: [1, 7]
en:
  title: "Seatbit: plan your clan's LAN parties together"
  text: >-
    Say whether you're coming, unsure or not coming, track tickets and the waitlist, and see who
    else is in. Leads get reminders and an overview of who still has to answer. Sign in with
    Discord.
de:
  title: "Seatbit: LAN-Partys mit dem Clan zusammen planen"
  text: >-
    Sag, ob du kommst, unsicher bist oder nicht kommst, behalte Tickets und Warteliste im Blick und
    sieh, wer sonst dabei ist. Leads bekommen Erinnerungen und eine Übersicht, wer noch antworten
    muss. Anmeldung mit Discord.
