date: 2026-11-12
type: new
pr: 36
en:
  title: "Seat wishes, self pick, then leads finalize"
  text: >-
    Members first say who they want to sit next to. Leads can let everyone pick a seat themselves,
    then finalize the plan.
de:
  title: "Sitzwünsche, selbst wählen, dann legen die Leads fest"
  text: >-
    Mitglieder sagen zuerst, neben wem sie sitzen möchten. Leads können alle selbst einen Platz
    wählen lassen und legen den Plan dann fest.
