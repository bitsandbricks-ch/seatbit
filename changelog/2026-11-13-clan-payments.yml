date: 2026-11-13
type: new
pr: 112
en:
  title: Clan payments
  text: >-
    Clans can track yearly dues, ticket money and shared costs: who owes what and who paid. The
    money goes to the clan directly; nothing is paid through Seatbit. Each clan turns it on in
    Manage → Payments.
de:
  title: Clan-Zahlungen
  text: >-
    Clans können Jahresbeiträge, Ticketgeld und geteilte Kosten verwalten: wer was schuldet und wer
    bezahlt hat. Das Geld geht direkt an den Clan; über Seatbit wird nichts bezahlt. Jeder Clan
    schaltet es unter Verwalten → Zahlungen ein.
