date: 2026-11-13
type: new
pr: 107
en:
  title: "One-off donations with a Donor badge"
  text: >-
    Where the operator turns it on, you can give a one-off amount to the people who run the
    instance, for yourself or for your clan.
de:
  title: "Einmalige Spenden mit Spender-Abzeichen"
  text: >-
    Wo der Betreiber es einschaltet, kannst du den Leuten, die die Instanz betreiben, einmalig etwas
    geben, für dich oder für deinen Clan.
