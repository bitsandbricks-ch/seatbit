date: 2026-11-13
type: new
en:
  title: "Emergency contact and dietary needs"
  text: >-
    Add an emergency contact and your dietary needs or allergies on your profile. Only the leads of
    events you come to see them, on a new Emergency tab, and each look is logged. On the Food tab
    leads see how many people coming have dietary needs.
de:
  title: "Notfallkontakt und Ernährung"
  text: >-
    Trag in deinem Profil einen Notfallkontakt und deine Angaben zu Ernährung oder Allergien ein.
    Nur die Leads von Events, an die du kommst, sehen sie in einem neuen Tab «Notfall», und jeder
    Blick darauf wird protokolliert. Im Tab «Essen» sehen Leads, wie viele, die kommen, Angaben zur
    Ernährung gemacht haben.
