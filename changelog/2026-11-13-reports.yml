type: new
pr: 110
en:
  title: "Report a clan or an event"
  text: >-
    If a clan or event breaks the rules, report it at the bottom of its page. Reports go to the
    platform moderators, never to the clan.
de:
  title: "Clan oder Event melden"
  text: >-
    Verstösst ein Clan oder Event gegen die Regeln, melde es unten auf der Seite. Meldungen gehen an
    die Moderation der Plattform, nie an den Clan.
