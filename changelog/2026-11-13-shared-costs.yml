date: 2026-11-13
type: new
en:
  title: Shared costs
  text: >-
    Events have a new Costs tab: log what you paid for the group (tickets, fuel, snacks) and who it's
    split between. Seatbit shows everyone's balance and who pays whom, and you tick off payments once
    the money has changed hands.
de:
  title: Geteilte Kosten
  text: >-
    Events haben einen neuen Tab Kosten: Trag ein, was du für die Gruppe bezahlt hast (Tickets, Benzin,
    Snacks) und unter wem es aufgeteilt wird. Seatbit zeigt alle Saldi und wer wem wie viel zahlt, und
    ihr hakt Zahlungen ab, sobald das Geld geflossen ist.
