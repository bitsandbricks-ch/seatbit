date: 2026-11-13
type: improved
audience: admins
en:
  title: Security improvements
  text: >-
    Moderators and support see clans' events read-only: only the clan's members answer and add
    things there.
de:
  title: Sicherheitsverbesserungen
  text: >-
    Moderatoren und Support sehen die Events der Clans nur noch zum Lesen: Antworten und Einträge
    machen nur die Mitglieder des Clans.
