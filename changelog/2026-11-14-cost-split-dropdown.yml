date: 2026-11-14
type: improved
en:
  title: "Easier to pick who shares a cost"
  text: >-
    On the Costs tab, who an expense is split between is now a dropdown with avatars and a search,
    instead of a long row of checkboxes. Handy for big groups, and it takes less room on the phone.
de:
  title: "Einfacher wählen, wer sich Kosten teilt"
  text: >-
    Im Tab Kosten wählst du jetzt in einem Dropdown mit Avataren und Suche, auf wen eine Ausgabe
    aufgeteilt wird, statt in einer langen Reihe von Kästchen. Praktisch für grosse Gruppen und
    platzsparend auf dem Handy.
