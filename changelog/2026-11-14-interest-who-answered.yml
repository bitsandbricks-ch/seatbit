date: 2026-11-14
type: improved
en:
  title: "See who answered the interest check"
  text: >-
    During an interest check, the event lists who is interested, who said maybe and who isn't, not just the numbers.
de:
  title: "Sieh, wer bei der Interessensabfrage geantwortet hat"
  text: >-
    Während einer Interessensabfrage zeigt der Event, wer interessiert ist, wer vielleicht kommt und wer nicht, nicht nur die Zahlen.
