date: 2026-11-14
type: improved
pr: 138
en:
  title: "Seat wishes: distances and automatic re-planning"
  text: >-
    "Near someone" and the new "Away from someone" wishes take a distance: right next to, within 2 or 3
    seats, or the same row. Leads can let the seat plan re-plan itself whenever someone changes their
    wishes, and seat pages now update by themselves. The leads' wish overview is easier to read.
de:
  title: "Platzwünsche: Abstände und automatische Neuplanung"
  text: >-
    «Nahe bei jemandem» und der neue Wunsch «Weg von jemandem» haben einen Abstand: direkt daneben,
    max. 2 oder 3 Plätze oder dieselbe Reihe. Leads können den Sitzplan automatisch neu planen lassen,
    sobald jemand seine Wünsche ändert, und Sitzplan-Seiten aktualisieren sich jetzt selbst. Die
    Wunsch-Übersicht für Leads ist übersichtlicher.
