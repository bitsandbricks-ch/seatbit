date: 2026-11-15
type: improved
en:
  title: "Faster, tidier event tabs"
  text: >-
    The event page has fewer tabs: Overview, Seats, Attendees and Trip, which groups travel, packing
    list, games and costs. Switching tabs is now instant. The overview starts with an "At a glance"
    card that says in one line per tab why you'd open it, like "You owe CHF 12" or "3 games to
    install", with a yellow dot when something waits for you. Food orders have their own On site tab
    that shows up while the event runs; leads see it earlier to set up an order in advance.
de:
  title: "Schnellere, aufgeräumte Event-Tabs"
  text: >-
    Die Event-Seite hat weniger Tabs: Übersicht, Plätze, Teilnehmer und Trip, der Anreise, Packliste,
    Games und Kosten zusammenfasst. Der Wechsel zwischen den Tabs ist jetzt sofort da. Die Übersicht
    beginnt mit der Karte «Auf einen Blick», die pro Tab in einer Zeile sagt, warum du ihn öffnen
    solltest, etwa «Du schuldest CHF 12» oder «3 Games installieren», mit einem gelben Punkt, wenn dort
    etwas wartet. Essensbestellungen haben einen eigenen Tab «Vor Ort», der erscheint, während der Event
    läuft; Leads sehen ihn früher, um eine Bestellung vorzubereiten.
