date: 2026-11-15
type: improved
en:
  title: "Faster tabs on clan pages and your profile"
  text: >-
    Like on the event page, the tabs on the clan page, in the clan settings and on your profile now
    switch instantly, and a yellow dot marks a tab where something waits for you. The clan's stats
    are now a tab of the clan page.
de:
  title: "Schnellere Tabs auf Clan-Seiten und im Profil"
  text: >-
    Wie auf der Event-Seite wechseln die Tabs auf der Clan-Seite, in den Clan-Einstellungen und in
    deinem Profil jetzt sofort, und ein gelber Punkt zeigt einen Tab, in dem etwas auf dich wartet.
    Die Statistik des Clans ist jetzt ein Tab der Clan-Seite.
