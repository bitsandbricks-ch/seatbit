date: 2026-11-15
type: improved
en:
  title: "Food orders move to an On site tab"
  text: >-
    Food orders now have their own On site tab on the event page. It shows up while the event runs,
    right after Overview, so it's there when you need it and out of the way before. Leads see it
    earlier, so they can set up an order in advance.
de:
  title: "Essensbestellungen im neuen Tab «Vor Ort»"
  text: >-
    Essensbestellungen haben jetzt einen eigenen Tab «Vor Ort» auf der Event-Seite. Er erscheint,
    während der Event läuft, direkt nach der Übersicht: da, wenn du ihn brauchst, und vorher aus dem
    Weg. Leads sehen ihn schon früher, damit sie eine Bestellung vorbereiten können.
