date: 2026-11-15
type: improved
en:
  title: "Clan pages, your profile and platform admin list their sections"
  text: >-
    Like the event page, the clan page, clan settings, your profile and the platform admin now show
    their sections as a list instead of a tab bar: on a phone as rows on the first page, each with one
    line on what's in it and a yellow dot when something waits for you, on a desktop as a sidebar.
    Nothing hides off the edge of the screen any more.
de:
  title: "Clan-Seiten, Profil und Plattform-Admin listen ihre Bereiche auf"
  text: >-
    Wie die Event-Seite zeigen jetzt auch die Clan-Seite, die Clan-Einstellungen, dein Profil und der
    Plattform-Admin ihre Bereiche als Liste statt als Tab-Leiste: auf dem Handy als Zeilen auf der
    ersten Seite, jede mit einer Zeile zum Inhalt und einem gelben Punkt, wenn etwas auf dich wartet,
    am Computer als Seitenleiste. Nichts verschwindet mehr am Bildschirmrand.
