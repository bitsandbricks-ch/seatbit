date: 2026-11-15
type: improved
en:
  title: "A shorter top on the event page"
  text: >-
    The event page gets to the point faster: sharing is a small icon next to the title, date and place
    share one line, and the event website and ticket shop moved to the "At a glance" card and the
    checklist's ticket step. On phones leads get View and Manage as two small icons, and the folded
    checklist is a single line with your next step. The Seats tab opens with your own seat's details
    instead of a "You're at" line.
de:
  title: "Ein kürzerer Kopf auf der Event-Seite"
  text: >-
    Die Event-Seite kommt schneller zur Sache: Teilen ist ein kleines Symbol neben dem Titel, Datum und
    Ort stehen in einer Zeile, und Event-Website und Ticketshop findest du neu in der Karte «Auf einen
    Blick» und beim Ticket-Schritt der Checkliste. Auf dem Handy sehen Leads Ansehen und Verwalten als
    zwei kleine Symbole, und die zugeklappte Checkliste ist eine einzige Zeile mit deinem nächsten Schritt. Der Tab Plätze öffnet mit den Angaben
    zu deinem eigenen Platz statt einer Zeile «Du sitzt auf».
