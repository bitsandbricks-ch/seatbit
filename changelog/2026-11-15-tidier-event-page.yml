date: 2026-11-15
type: improved
en:
  title: "A tidier event page with a next-step guide"
  text: >-
    The event page has four tabs instead of eight, so they all fit on a phone: Overview, Seats, Attendees
    and Trip. Trip holds travel, packing, games, food and costs behind a small switch. Your checklist now
    marks your next step with a button that takes you there, and "Also for this event" shows what else
    is worth a look right now, like an open food order, people looking for a ride or money to settle.
    The event website, ticket shop and share button sit in one row.
de:
  title: "Eine aufgeräumtere Event-Seite mit nächstem Schritt"
  text: >-
    Die Event-Seite hat vier statt acht Tabs, damit alle aufs Handy passen: Übersicht, Plätze,
    Teilnehmer und Trip. Unter Trip findest du Anreise, Packen, Games, Essen und Kosten hinter einem
    kleinen Umschalter. Deine Checkliste zeigt jetzt den nächsten Schritt mit einem Knopf, der dich
    direkt hinführt, und «Auch für diesen Event» zeigt, was gerade sonst noch wichtig ist, etwa eine
    offene Essensbestellung, Leute, die eine Mitfahrt suchen, oder offene Kosten. Event-Website,
    Ticketshop und Teilen stehen in einer Zeile.
