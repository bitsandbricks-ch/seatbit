date: 2026-11-16
type: fixed
en:
  title: "Clearer messages when a form can't be saved"
  text: >-
    When something in a form is missing or wrong, Seatbit now says which field and why, in your
    language, for example "Town: please fill this in.", instead of a general error.
de:
  title: "Klarere Meldungen, wenn ein Formular nicht gespeichert werden kann"
  text: >-
    Fehlt in einem Formular etwas oder stimmt etwas nicht, sagt Seatbit jetzt, welches Feld und
    warum, in deiner Sprache, etwa «Ort: bitte ausfüllen.», statt einer allgemeinen Fehlermeldung.
