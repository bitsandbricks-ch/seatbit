date: 2026-11-16
type: new
en:
  title: "A look back after the LAN"
  text: >-
    Once an event is over, its overview shows a short recap: who came, your seat, the most wanted games,
    whether all shared costs are settled, and for Leads a shortcut to plan the next one.
de:
  title: "Rückblick nach der LAN"
  text: >-
    Ist ein Event vorbei, zeigt die Übersicht einen kurzen Rückblick: wer dabei war, dein Platz, die
    beliebtesten Games, ob alle geteilten Kosten beglichen sind, und für Leads eine Abkürzung, um das nächste
    zu planen.
