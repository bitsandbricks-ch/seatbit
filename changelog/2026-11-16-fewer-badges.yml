date: 2026-11-16
type: improved
en:
  title: "Fewer badges, more explanations on tap"
  text: >-
    Badges that repeated what the page already says are gone: your seat shows once on the Seats tab, and
    your answer once on the overview. "Final" and "Not final yet" on the seat plan explain themselves when
    you tap or hover them. Guests and seats in lists are small icons instead of labels.
de:
  title: "Weniger Badges, Erklärungen auf Antippen"
  text: >-
    Badges, die wiederholten, was die Seite schon sagt, sind weg: Dein Platz steht bei den Plätzen nur
    noch einmal, deine Antwort in der Übersicht auch. «Definitiv» und «Noch nicht definitiv» beim Sitzplan
    erklären sich, wenn du darauf tippst oder mit der Maus darüberfährst. Gäste und Plätze in Listen sind
    kleine Symbole statt Beschriftungen.
