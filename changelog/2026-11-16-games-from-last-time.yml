date: 2026-11-16
type: improved
en:
  title: "Last year's games, one tap away"
  text: >-
    The games list of a yearly LAN now offers the games your clan played at the previous one. Tap a game to
    put it back on the list, with its size and link.
de:
  title: "Die Games vom letzten Mal, einen Tipp entfernt"
  text: >-
    Die Games-Liste einer jährlichen LAN zeigt jetzt die Games, die euer Clan an der letzten gespielt hat. Tippe
    auf ein Game, um es mit Grösse und Link wieder auf die Liste zu setzen.
