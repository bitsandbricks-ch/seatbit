date: 2026-11-16
type: improved
en:
  title: "Your next step on the LANs list"
  text: >-
    Each event card on the LANs list now says what to do next, like "Next: Buy your ticket" with its
    deadline, or "All set" when you're done. The numbers for people going and free seats are small icons;
    hover or tap for the full text.
de:
  title: "Dein nächster Schritt in der LAN-Liste"
  text: >-
    Jede Event-Karte in der LAN-Liste sagt jetzt, was als Nächstes zu tun ist, etwa «Als Nächstes: Ticket
    kaufen» mit der Frist, oder «Alles erledigt», wenn du fertig bist. Die Zahlen für Zusagen und freie Plätze
    sind kleine Symbole; fahre darüber oder tippe für den ganzen Text.
