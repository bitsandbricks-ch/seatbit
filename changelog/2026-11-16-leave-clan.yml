date: 2026-11-16
type: improved
en:
  title: "Leaving a clan frees your spots"
  text: >-
    «Leave clan» now asks first. When someone leaves or is removed, their answers on the clan's upcoming events
    are withdrawn, so their spot goes to the next person on the waitlist.
    Answers with a ticket or payment stay for the leads to sort out. Lead roles on the clan's events end too.
de:
  title: "Wer den Clan verlässt, gibt seine Plätze frei"
  text: >-
    «Clan verlassen» fragt jetzt zuerst nach. Wer den Clan verlässt oder entfernt wird, dessen Antworten zu den
    kommenden Events werden zurückgezogen: Der Platz geht an die nächste Person auf der Warteliste. Antworten mit Ticket oder Zahlung bleiben, damit die Leads das regeln. Auch die
    Lead-Rollen bei Events des Clans enden.
