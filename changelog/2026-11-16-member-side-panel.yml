date: 2026-11-16
type: improved
en:
  title: "Member profiles open beside the list"
  text: >-
    On the clan pages, a click on a member opens their profile in a side panel (from the bottom on a
    phone), so the member list stays where you were. Close it, or open it as a full page.
de:
  title: "Mitgliederprofile öffnen sich neben der Liste"
  text: >-
    Auf den Clan-Seiten öffnet ein Klick auf ein Mitglied das Profil in einem Seitenpanel (auf dem
    Handy von unten), die Mitgliederliste bleibt also, wo du warst. Schliesse es oder öffne es als ganze Seite.
