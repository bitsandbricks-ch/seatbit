date: 2026-11-16
type: improved
en:
  title: "Your own packing items come along"
  text: >-
    Things you added to your packing list at earlier LANs are offered again on the next one. Tap one to add it,
    or add them all at once.
de:
  title: "Deine eigenen Packsachen kommen mit"
  text: >-
    Was du an früheren LANs selbst auf deine Packliste gesetzt hast, wird dir an der nächsten wieder angeboten.
    Tippe auf einen Eintrag, um ihn hinzuzufügen, oder füge alle auf einmal hinzu.
