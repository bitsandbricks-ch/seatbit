date: 2026-11-16
type: new
en:
  title: "Quick search"
  text: >-
    Press Ctrl+K (⌘K on a Mac) or tap the magnifier in the header to find an event, a clanmate or a clan
    by name, nick or place, and jump right there.
de:
  title: "Schnellsuche"
  text: >-
    Drücke Ctrl+K (⌘K auf dem Mac) oder tippe auf die Lupe oben, um ein Event, ein Clan-Mitglied oder einen
    Clan nach Name, Nick oder Ort zu finden und direkt hinzuspringen.
