date: 2026-11-16
type: improved
en:
  title: "A simpler interest check"
  text: >-
    During an interest check the event page now only asks "Would you come?" with the usual I'm coming,
    Unsure and Not coming, and shows who answered what, including who hasn't answered yet. Seats,
    travel, packing, games and costs stay hidden until the Leads open sign-up, and your answer carries
    over. Leads can remind everyone without an answer right from the list, and can schedule sign-up
    to open by itself at a set date.
de:
  title: "Eine einfachere Interessensabfrage"
  text: >-
    Während einer Interessensabfrage fragt die Event-Seite jetzt nur «Wärst du dabei?» mit den
    gewohnten Antworten Ich komme, Unsicher und Nicht dabei, und zeigt, wer was geantwortet hat, auch
    wer noch nicht geantwortet hat. Sitzplätze, Anreise, Packliste, Games und Kosten bleiben
    versteckt, bis die Leads die Anmeldung öffnen, und deine Antwort bleibt. Leads können alle ohne
    Antwort direkt aus der Liste erinnern und die Anmeldung auf ein Datum planen, an dem sie von selbst
    aufgeht.
