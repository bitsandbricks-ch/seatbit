date: 2026-11-16
type: new
en:
  title: "Tournament teams"
  text: >-
    Build teams for LAN tournaments right under a game on the Games tab: start a team, set how many
    players it needs, and let others join while there's room. Tap a team to see its players, its open
    places and who still needs a team. Everyone gets a Discord DM when their team is complete.
de:
  title: "Turnier-Teams"
  text: >-
    Stelle Teams für LAN-Turniere direkt unter einem Spiel im Tab Spiele zusammen: Starte ein Team, lege
    fest, wie viele Spieler es braucht, und lass andere beitreten, solange es Platz hat. Tippe auf ein Team,
    um Spieler, freie Plätze und alle ohne Team zu sehen. Ist das Team komplett, gibt es eine Discord-DM.
