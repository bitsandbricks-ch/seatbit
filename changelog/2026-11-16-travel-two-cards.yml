date: 2026-11-16
type: improved
en:
  title: "Rides and places to sleep at a glance"
  text: >-
    On an event's Travel section, rides and places to sleep now show as two cards next to each other
    (one below the other on a phone), so there's no extra switch to tap through.
de:
  title: "Mitfahrten und Schlafplätze auf einen Blick"
  text: >-
    In der Anreise eines Events stehen Mitfahrten und Schlafplätze jetzt als zwei Karten nebeneinander
    (auf dem Handy untereinander). Ein zusätzlicher Umschalter fällt weg.
