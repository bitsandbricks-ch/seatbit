date: 2026-11-17
type: improved
en:
  title: "The same badges everywhere"
  text: >-
    The check mark, the Discord badge and the Donor badge now show after a member's name everywhere:
    on your profile, member profiles, the event's attendee lists and the Leads' pages (attendees,
    waitlist, who's missing, emergency info and seat wishes).
de:
  title: "Überall dieselben Abzeichen"
  text: >-
    Das Häkchen, das Discord-Abzeichen und das Spender-Abzeichen erscheinen jetzt überall nach dem Namen
    eines Mitglieds: in deinem Profil, in Mitgliederprofilen, in den Teilnehmerlisten eines Events und
    auf den Seiten der Leads (Teilnehmer, Warteliste, wer fehlt, Notfallinfos und Platzwünsche).
