date: 2026-11-17
type: improved
en:
  title: "Message people on Discord"
  text: >-
    Leads can open a member's Discord profile straight from the attendee list, the clan's member list
    and member profiles, to send them a message. On the event page, members find a Discord link next to
    each Lead's email.
de:
  title: "Leute auf Discord anschreiben"
  text: >-
    Leads öffnen das Discord-Profil eines Mitglieds direkt aus der Teilnehmerliste, der Mitgliederliste
    des Clans und dem Mitgliederprofil, um ihm eine Nachricht zu senden. Auf der Event-Seite finden
    Mitglieder neben der E-Mail jedes Leads auch einen Discord-Link.
