date: 2026-11-17
type: improved
en:
  title: "LAN types are shared by all clans"
  text: >-
    Each LAN party now exists once on Seatbit, kept up to date by the platform support, and every clan
    picks the ones it goes to. Your clan keeps its own seats, spots, deadlines, Discord setting, contacts and
    lead to-dos per LAN type. Your nick and LAN ID for a LAN now follow you into every clan. Duplicate LAN
    types with the same name were merged.
de:
  title: "LAN-Typen gelten für alle Clans"
  text: >-
    Jede LAN-Party gibt es auf Seatbit jetzt nur noch einmal, gepflegt vom Plattform-Support, und jeder Clan
    wählt die aus, an die er geht. Euer Clan behält pro LAN-Typ seine eigenen Plätze, Kontingente, Fristen,
    Discord-Einstellung, Kontakte und Lead-To-dos. Dein Nick und deine LAN-ID für eine LAN gelten jetzt in
    jedem Clan. Doppelte LAN-Typen mit gleichem Namen wurden zusammengeführt.
