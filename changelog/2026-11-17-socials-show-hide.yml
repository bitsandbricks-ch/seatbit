date: 2026-11-17
type: improved
en:
  title: "Choose which socials others see"
  text: >-
    Each social on your profile has a "Show on profile" box, so you can keep some to yourself. With
    Discord linked, the Discord field fills in your Discord username for you.
de:
  title: "Wähle, welche Socials andere sehen"
  text: >-
    Jeder Social-Eintrag im Profil hat ein Feld «Im Profil zeigen», damit du einzelne für dich
    behalten kannst. Mit verknüpftem Discord übernimmt das Discord-Feld deinen Discord-Benutzernamen.
