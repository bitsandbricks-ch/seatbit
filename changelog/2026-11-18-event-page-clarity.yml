date: 2026-11-18
type: improved
en:
  title: A clearer event page and a help page
  text: "«How this event works» explains the whole flow of each event, from answering to the LAN, with its own dates, and marks where you are. The seat tab shows where the plan stands in one bar and who wants to sit near you. Travel, packing, games and costs open a month before the event (earlier once something is in them), food orders are now just «Orders», and the new help page answers the usual questions. Also fixed a problem with the checklist on the waitlist."
de:
  title: Eine übersichtlichere Event-Seite und eine Hilfeseite
  text: "«So läuft dieses Event» erklärt den ganzen Ablauf jedes Events, von der Antwort bis zur LAN, mit seinen eigenen Daten, und zeigt, wo du gerade stehst. Der Tab «Plätze» zeigt in einem Balken, wo der Plan steht, und wer neben dir sitzen möchte. Anreise, Packliste, Games und Kosten öffnen einen Monat vor dem Event (früher, sobald etwas eingetragen ist), Essensbestellungen heissen jetzt «Bestellungen», und die neue Hilfeseite beantwortet die üblichen Fragen. Ausserdem ein Problem mit der Checkliste auf der Warteliste behoben."
