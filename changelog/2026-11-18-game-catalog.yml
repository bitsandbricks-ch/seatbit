date: 2026-11-18
type: new
en:
  title: Games with covers, store links and Steam install
  text: Games now come from one shared catalog. Start typing a name and pick the game; Steam games bring their cover, install size, price and LAN mode by themselves. Each game links to its store page, and Steam games get an Install button that opens Steam's install dialog. Size, players and links are entered once and show on every event.
de:
  title: Games mit Cover, Store-Link und Steam-Installation
  text: Games kommen jetzt aus einem gemeinsamen Katalog. Tipp den Namen und wähl das Game aus; Steam-Games bringen Cover, Installationsgrösse, Preis und LAN-Modus selbst mit. Jedes Game verlinkt auf seine Store-Seite, und Steam-Games haben einen Installieren-Knopf, der den Installationsdialog von Steam öffnet. Grösse, Spielerzahl und Links trägst du einmal ein, sie gelten für alle Events.
