date: 2026-11-18
type: improved
en:
  title: Games and costs get their own tabs
  text: "On the event page, Games and Costs are now tabs of their own and always there. The Trip tab keeps travel and the packing list and still opens a month before the event."
de:
  title: Games und Kosten mit eigenen Tabs
  text: "Auf der Event-Seite sind Games und Kosten jetzt eigene Tabs und immer da. Der Tab «Reise» enthält Anreise und Packliste und öffnet weiterhin einen Monat vor dem Event."
