date: 2026-11-18
type: improved
en:
  title: Clearer games list and a page for every game
  text: Every game on an event now has a cover box of the same size (in the game's colour when there is no cover), and shows who voted and who installed it bigger, with avatars. Everyone signed in can browse all games and open a game's page with its size, players, store link and their events that play it.
de:
  title: Übersichtlichere Games-Liste und eine Seite pro Game
  text: Jedes Game an einem Event hat jetzt ein gleich grosses Cover-Feld (in der Farbe des Games, wenn es kein Cover gibt) und zeigt grösser und mit Avataren, wer dafür gestimmt und wer es installiert hat. Alle Angemeldeten können alle Games durchstöbern und die Seite eines Games öffnen, mit Grösse, Spielerzahl, Store-Link und ihren Events, an denen es gespielt wird.
