en:
  title: Add Seatbit to your phone's home screen
  text: Seatbit can now be added to the home screen and opens like an app, with its own icon and without the browser bar.
de:
  title: Seatbit auf dem Startbildschirm
  text: Du kannst Seatbit jetzt zum Startbildschirm deines Handys hinzufügen. Es öffnet sich dann wie eine App, mit eigenem Icon und ohne Browserleiste.
