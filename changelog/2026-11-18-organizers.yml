date: 2026-11-18
type: improved
en:
  title: "Leads are now called organizers"
  text: "The people from your clan who plan the trip to an event are now called organizers everywhere, on the website, in mails and in Discord. Nothing changes about what they can do. The LAN's own team is called «the event's team»."
de:
  title: "Aus Leads werden Organisatoren"
  text: "Die Leute aus deinem Clan, die die Reise an ein Event planen, heissen jetzt überall Organisatoren, auf der Website, in Mails und auf Discord. An dem, was sie tun können, ändert sich nichts. Das Team der LAN selbst heisst «Veranstalter»."
