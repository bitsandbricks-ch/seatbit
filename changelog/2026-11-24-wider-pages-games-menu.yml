date: 2026-11-24
type: improved
en:
  title: "Wider pages and a Games menu"
  text: "Pages use more of the screen on big monitors, so seat maps, lists and side columns get more room. The game catalog is now in the main menu: **Games** in the top bar on a computer and in the tab bar on a phone."
de:
  title: "Breitere Seiten und ein Spiele-Menü"
  text: "Auf grossen Bildschirmen nutzen die Seiten mehr Platz, damit Sitzpläne, Listen und Seitenspalten mehr Raum haben. Der Spielekatalog ist jetzt im Hauptmenü: **Spiele** oben in der Leiste am Computer und unten in der Leiste auf dem Handy."
