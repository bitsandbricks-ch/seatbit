# Non-secret settings. Most of these can also be changed later by an admin
# under /admin/settings (values saved there override env vars).
apiVersion: v1
kind: ConfigMap
metadata:
  name: seatbit-config
data:
  BETTER_AUTH_URL: https://seatbit.ch
  TZ: Europe/Zurich
  MAIL_FROM: "Seatbit <noreply@seatbit.ch>"
  # The reminder CronJob calls /api/cron/reminders, so the built-in timer is off.
  REMINDER_INTERVAL_MINUTES: "0"
  SIGNUP_OPEN: "true"
