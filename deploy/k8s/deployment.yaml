apiVersion: apps/v1
kind: Deployment
metadata:
  name: seatbit
  labels:
    app.kubernetes.io/name: seatbit
spec:
  # SQLite on a ReadWriteOnce volume: exactly one pod, and stop the old pod
  # before starting the new one.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: seatbit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seatbit
    spec:
      imagePullSecrets:
        - name: ghcr-pull   # only needed while the GHCR package is private
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seatbit
          image: ghcr.io/bitsandbricks-ch/seatbit:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: seatbit-config
            - secretRef:
                name: seatbit-secrets
          env:
            - name: DATABASE_PATH
              value: /data/seatbit.db
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.next/cache
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: seatbit-data
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
