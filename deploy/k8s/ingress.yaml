apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seatbit
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: [seatbit.ch]
      secretName: seatbit-tls
  rules:
    - host: seatbit.ch
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seatbit
                port:
                  name: http
