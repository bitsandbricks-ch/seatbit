# kubectl apply -k deploy/k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: seatbit
resources:
  - namespace.yaml
  - pvc.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - reminders-cronjob.yaml
  - backup-cronjob.yaml
# Secrets are not in git. Create them once (see README.md in this folder):
#   kubectl -n seatbit create secret generic seatbit-secrets --from-env-file=secrets.env
# To pin a release instead of following main:
# images:
#   - name: ghcr.io/bitsandbricks-ch/seatbit
#     newTag: sha-abc1234
