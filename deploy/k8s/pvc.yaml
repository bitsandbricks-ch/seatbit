# SQLite database. ReadWriteOnce: the app runs as a single replica.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seatbit-data
spec:
  accessModes: [ReadWriteOnce]
  # storageClassName: longhorn   # leave unset for the cluster default
  resources:
    requests:
      storage: 1Gi
---
# Nightly SQLite backups (see backup-cronjob.yaml).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seatbit-backups
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
