# Sends due reminder mails / Discord pings by calling the app's cron endpoint.
# Reminders are deduplicated in the app, so an extra run never double-sends.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: seatbit-reminders
spec:
  schedule: "*/15 * * * *"
  timeZone: Europe/Zurich
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: trigger
              image: ghcr.io/bitsandbricks-ch/seatbit:main
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: seatbit-secrets
                      key: CRON_SECRET
              command:
                - node
                - -e
                - |
                  fetch("http://seatbit/api/cron/reminders", {
                    headers: { Authorization: "Bearer " + process.env.CRON_SECRET },
                  }).then(async (r) => {
                    console.log(r.status, await r.text());
                    if (!r.ok) process.exit(1);
                  }).catch((e) => { console.error(e); process.exit(1); });
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 128Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
