site_name: Seatbit
site_description: Coordinate who in your clan goes to which LAN party, tickets and seats. Self-hostable.
site_url: https://bitsandbricks-ch.github.io/seatbit/
repo_url: https://github.com/bitsandbricks-ch/seatbit
repo_name: bitsandbricks-ch/seatbit
edit_uri: edit/main/docs/
copyright: Seatbit is free software under the GNU AGPL-3.0 · Powered by <a href="https://bitsandbricks.ch">bitsandbricks.ch</a>

docs_dir: docs
exclude_docs: |
  requirements.txt
  hooks/

# Renders changelog/*.yml into the changelog pages.
hooks:
  - docs/hooks/changelog.py

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    scheme: slate
    primary: custom
    accent: custom
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - content.code.copy
    - content.action.edit
    - content.tabs.link

plugins:
  - search
  # Old URLs from before the docs were split into Features / Installation /
  # Development / Contributing keep working.
  - redirects:
      redirect_maps:
        members/index.md: features/accounts.md
        members/events.md: features/attendance.md
        members/seats.md: features/seats.md
        members/extras.md: features/travel-packing.md
        members/profile.md: features/accounts.md
        orgas/index.md: features/clans.md
        orgas/members.md: features/members-guests.md
        orgas/events.md: features/events.md
        orgas/seats.md: features/seats.md
        orgas/discord.md: features/discord.md
        admins/index.md: features/admin.md
        self-hosting/index.md: installation/index.md
        self-hosting/docker.md: installation/docker.md
        self-hosting/configuration.md: installation/configuration.md
        self-hosting/discord.md: installation/discord.md
        self-hosting/email.md: installation/email.md
        self-hosting/legal.md: installation/legal.md
        self-hosting/supporters.md: installation/stripe.md
        self-hosting/operations.md: installation/operations.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Features:
      - features/index.md
      - Basics:
          - Accounts and profile: features/accounts.md
          - Clans and roles: features/clans.md
          - Members and guests: features/members-guests.md
          - Languages: features/languages.md
          - Light and dark theme: features/theme.md
          - What's new: features/whats-new.md
      - Events:
          - Event lifecycle: features/events.md
          - Lead to-dos and contacts: features/lead-todos.md
          - Attendance and tickets: features/attendance.md
          - Seats: features/seats.md
          - Reminders and who's missing: features/reminders.md
      - At the LAN:
          - Travel and packing list: features/travel-packing.md
          - Games: features/games.md
          - Food orders: features/food.md
          - Shared costs: features/shared-costs.md
          - Emergency contact and diet: features/emergency.md
      - Integrations:
          - Discord and WhatsApp: features/discord.md
      - Administration:
          - Clan payments: features/payments.md
          - Audit log: features/audit-log.md
          - Supporter badge: features/supporters.md
          - Donations: features/donations.md
          - Platform admin: features/admin.md
          - Reports and suspensions: features/moderation.md
  - Installation:
      - installation/index.md
      - Run it:
          - Docker: installation/docker.md
          - Kubernetes: installation/kubernetes.md
          - Configuration: installation/configuration.md
      - Set up:
          - Discord app and bot: installation/discord.md
          - Email: installation/email.md
          - Operator, privacy and terms: installation/legal.md
          - Stripe (payments): installation/stripe.md
      - Operate:
          - Backups, upgrades, metrics and admin CLI: installation/operations.md
          - Security hardening: installation/security.md
  - Development:
      - development/index.md
      - Architecture: development/architecture.md
      - Database and migrations: development/database.md
      - Tests: development/testing.md
      - Screenshots: development/screenshots.md
      - CI and releases: development/ci.md
  - Contributing:
      - contributing/index.md
      - Code guidelines: contributing/guidelines.md
      - Writing docs: contributing/docs.md
      - Changelog entries: contributing/changelog.md
      - AI coding agents: contributing/agents.md
  - Changelog:
      - changelog/index.md
      - Deutsch: changelog/de.md
